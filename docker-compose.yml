services:
  agent:
    build: .
    command: python main.py
    env_file: .env
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - agent
    restart: unless-stopped
