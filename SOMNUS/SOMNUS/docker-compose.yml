services:
  agent:
    build: .
    command: python main.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      # Shared volume is what makes the command channel work across containers.
      - ./data:/app/data
      - ./skills:/app/skills
    depends_on:
      - agent
    restart: unless-stopped
